name: Current Backend

on:
  pull_request:
  push:
    branches:
      - roadmap/extract-c-external-product-language

permissions:
  contents: read

jobs:
  current-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run exact current backend gate
        run: ./current-backend-test.sh --report current-backend-report.json
      - name: Upload bounded backend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-backend-report
          path: current-backend-report.json
          if-no-files-found: warn
