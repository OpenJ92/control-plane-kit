name: Current package tests

on:
  push:
    branches:
      - main
      - develop
      - "roadmap/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-package-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: control-plane-kit-core
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run authoritative package gate
        run: ./control-plane-kit-core/test.sh

  operations:
    name: control-plane-kit-operations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run authoritative package gate
        run: ./control-plane-kit-operations/test.sh
