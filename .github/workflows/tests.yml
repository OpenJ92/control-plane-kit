name: tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-package-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-tests:
    name: control-plane-kit-servers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker-first tests
        run: ./test.sh
